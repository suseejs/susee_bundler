[package]
name = "susee_bundler"
version = "0.2.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/suseejs/susee_bundler"
readme = "README.md"
# Exclude the internal test binary and its generated JSON output from the
# published crate. `src/main.rs` is a local test harness, not a shipped binary.
exclude = ["src/main.rs"]

[dependencies]
dependensa = "0.3.0"
colored = "2"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*", features = ["preserve_order"] }
oxc = { version = "*", features = [
    "ast_visit",
    "codegen",
    "semantic",
    "minifier",
] }
napi = "3"
napi-derive = "3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"

[lints.rust]
missing_docs = "warn"

[lib]
name = "susee_bundler"
path = "src/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
crate-type = ["rlib", "cdylib"]
